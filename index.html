<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="用精确解和真实几何做的弦理论 3D 可视化：相对论性的弦、世界面、T 对偶、Calabi–Yau 截面。" />
  <meta name="theme-color" content="#000000" />
  <title>弦理论 · 3D 可视化</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="gl" aria-label="弦理论三维可视化画面，可拖动旋转、滚轮缩放"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="top">
    <div class="brand">弦理论</div>
    <nav class="seg" id="nav" aria-label="场景"></nav>
    <button class="icon-btn" id="play" type="button" aria-label="暂停">
      <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3" width="3" height="10" rx="1"/><rect x="9.5" y="3" width="3" height="10" rx="1"/></svg>
      <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6a.6.6 0 0 0 .92.5l7.3-4.8a.6.6 0 0 0 0-1L5.92 2.7a.6.6 0 0 0-.92.5z"/></svg>
    </button>
  </header>

  <section class="card info" aria-live="off">
    <button class="card-head" id="info-toggle" type="button" aria-label="展开或收起说明">
      <h1 id="title"></h1>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="info-body">
      <p id="blurb"></p>
      <div class="eq" id="eq"></div>
      <div class="legend" id="legend"><span>静止</span><i></i><span>光速 c</span></div>
      <div class="bars" id="bars" hidden></div>
      <div class="readouts" id="readouts"></div>
    </div>
  </section>

  <section class="card ctrl" aria-label="参数">
    <div id="ctrl-body"></div>
    <div class="row">
      <label class="row-head" for="speed"><span>播放速度</span><output id="speed-out">1.0×</output></label>
      <input id="speed" type="range" min="0.1" max="2.5" step="0.1" value="1" />
    </div>
  </section>

  <aside id="inset" hidden>
    <div id="inset-view"></div>
    <p id="inset-cap"></p>
  </aside>

  <script src="app.js"></script>
</body>
</html>
